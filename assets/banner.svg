<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GrexLabs — Free AI API Platform | 314+ Models | No API Key">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.45" stop-color="#0e1524"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#22d3ee;#a78bfa;#f472b6;#60a5fa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#60a5fa;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#60a5fa;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e9f0"/>
      <stop offset="1" stop-color="#8b95ad"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="22" fill="none" stroke="#243047" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="none" stroke="url(#sheen)" stroke-width="2" opacity="0.7"/>

  <!-- floating orbs -->
  <circle cx="180" cy="70" r="110" fill="url(#orb1)">
    <animate attributeName="cx" values="180;320;180" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;150;70" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="230" r="130" fill="url(#orb2)">
    <animate attributeName="cx" values="980;820;980" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;140;230" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="40" r="90" fill="url(#orb3)">
    <animate attributeName="cx" values="620;720;620" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- particles -->
  <g fill="#93c5fd">
    <circle cx="140" cy="250" r="2.5" opacity="0.8"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="250;230;250" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="50" r="2" opacity="0.6"><animate attributeName="opacity" values="1;0.15;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="270" r="2.4" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="60" r="2.8" opacity="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="4.8s" repeatCount="indefinite"/><animate attributeName="cy" values="60;85;60" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="150" r="2.2" opacity="0.55"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="180" r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.85;0.15;0.85" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="90" r="2" opacity="0.65"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="140" r="1.6" opacity="0.45"><animate attributeName="opacity" values="1;0.25;1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g opacity="0.85">
    <line x1="980" y1="48" x2="1040" y2="70" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="1040" cy="70" r="2.5" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;3;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- hex emblem -->
  <g transform="translate(85,85) scale(2.4)" filter="url(#glow)">
    <path d="M32 6 L54 19 V45 L32 58 L10 45 V19 Z" fill="#0b1220" stroke="url(#hexStroke)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 16.5 L45.5 47.5 H38.6 L36.3 41.5 H27.7 L25.4 47.5 H18.5 Z" fill="#e5e9f0"/>
    <path d="M29.3 36.8 h5.4 L32 28.6 Z" fill="#0b0e14"/>
    <path d="M32 6 L54 19 V45 L32 58 L10 45 V19 Z" fill="none" stroke="#60a5fa" stroke-width="1.4" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#60a5fa;#22d3ee;#a78bfa;#60a5fa" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- orbit ring -->
    <ellipse cx="32" cy="32" rx="34" ry="34" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="14s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- title -->
  <text x="250" y="145" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="6" fill="url(#shimmer)" filter="url(#glow)">GREXLABS</text>
  <text x="252" y="195" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#a8b6d4">FREE · OPENAI-COMPATIBLE · NO API KEY</text>

  <!-- underline sweep -->
  <rect x="252" y="212" width="420" height="3" rx="2" fill="#1e293b"/>
  <rect x="252" y="212" width="120" height="3" rx="2" fill="#22d3ee">
    <animate attributeName="x" values="252;552;252" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="80;160;80" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <g>
      <rect x="252" y="236" width="168" height="36" rx="18" fill="#0f1b33" stroke="#3b82f6" stroke-width="1.6"/>
      <circle cx="274" cy="254" r="6" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;7;5" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <text x="292" y="260" fill="#d6e4ff">314+ MODELS</text>
    </g>
    <g>
      <rect x="432" y="236" width="188" height="36" rx="18" fill="#0f1b33" stroke="#22d3ee" stroke-width="1.6">
        <animate attributeName="stroke" values="#22d3ee;#60a5fa;#22d3ee" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="452" y="260" fill="#b8f3ff">KEYLESS FREE API</text>
    </g>
    <g>
      <rect x="632" y="236" width="200" height="36" rx="18" fill="#0f1b33" stroke="#a78bfa" stroke-width="1.6">
        <animate attributeName="stroke" values="#a78bfa;#f472b6;#a78bfa" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="652" y="260" fill="#ddd6fe">GPT-6.2 ASTRA</text>
    </g>
    <g>
      <rect x="844" y="236" width="210" height="36" rx="18" fill="#0f1b33" stroke="#22c55e" stroke-width="1.6"/>
      <text x="864" y="260" fill="#bbf7d0">SEARCH + IMAGES</text>
    </g>
  </g>

  <!-- live chip -->
  <g transform="translate(980,55)">
    <rect width="160" height="34" rx="17" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#86efac">LIVE · grexlabs.in</text>
  </g>
</svg>
